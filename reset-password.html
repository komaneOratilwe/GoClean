<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - GoClean</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .auth-card {
            width: 450px;
            max-width: 90%;
            padding: 40px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            box-sizing: border-box;
        }

        .image-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .image-container img {
            width: 120px;
            height: auto;
        }

        .auth-card h2 {
            text-align: center;
            margin: 0 0 10px 0;
            color: #1a1a1a;
            font-size: 24px;
        }

        .auth-card p {
            text-align: center;
            margin: 0 0 30px 0;
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333333;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .login-redirect {
            text-align: center;
            margin-top: 25px;
        }

        .login-redirect a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .login-redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="auth-card">

        <div class="image-container">
            <img src="images/reset.png" alt="Reset password illustration">
        </div>

        <h2>Set New Password</h2>

        <p>
            Please enter your new password below.
        </p>

        <form id="resetPasswordForm">

            <div class="input-group">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    name="password"
                    required
                    placeholder="Enter new password">

            </div>

            <div class="input-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    required
                    placeholder="Confirm new password">

            </div>

            <button type="submit" class="btn">
                Update Password
            </button>

        </form>

        <div class="login-redirect">

            <a href="login.html">
                &larr; Back to Login
            </a>

        </div>

    </div>

    <script src="js/reset-password.js"></script>

</body>

</html>
